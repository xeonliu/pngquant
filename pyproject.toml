[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pngquant"
version = "3.0.4"
description = "Convert 24/32-bit PNG images to efficient 8-bit format with alpha channel"
authors = [
    {name = "Kornel Lesiński", email = "kornel@pngquant.org"}
]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
keywords = ["quantization", "palette", "image", "pngquant", "compression", "png"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://pngquant.org"
Repository = "https://github.com/kornelski/pngquant"
Documentation = "https://github.com/kornelski/pngquant#readme"

[tool.maturin]
features = ["python"]
module-name = "pngquant"
python-source = "python"
